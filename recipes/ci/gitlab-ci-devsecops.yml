# ==============================================================================
# 🛡️ FRIDAY-PROTOCOL: GitLab CI DevSecOps Pipeline
# Compliant with BSSN Secure App Framework & OWASP Standards
# ==============================================================================

stages:
  - lint
  - test
  - security_sast
  - security_container
  - deploy_staging
  - security_dast
  - deploy_production

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  APP_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

# ------------------------------------------------------------------------------
# Stage 1: Code Linting & Clean Code Hygiene
# ------------------------------------------------------------------------------
lint_hygiene:
  stage: lint
  image: cytopia/phpcs:latest
  script:
    - phpcs --standard=PSR12 app/
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "staging"'

# ------------------------------------------------------------------------------
# Stage 2: Automated Testing & Test Coverage
# ------------------------------------------------------------------------------
unit_and_feature_tests:
  stage: test
  image: php:8.2-cli
  before_script:
    - apt-get update && apt-get install -y unzip libzip-dev sqlite3 libsqlite3-dev
    - docker-php-ext-install zip pdo pdo_sqlite
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --prefer-dist
    - cp .env.example .env
    - php artisan key:generate
    - touch database/database.sqlite
  script:
    - php artisan test --coverage-text --min=80
  coverage: '/^\s*Lines:\s*(\d+.\d+\%)/'
  artifacts:
    when: always
    reports:
      junit: junit.xml

# ------------------------------------------------------------------------------
# Stage 3: SAST & SCA Security Scans
# ------------------------------------------------------------------------------
gitleaks_secret_detection:
  stage: security_sast
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --verbose --redact
  allow_failure: false

trivy_dependency_sca:
  stage: security_sast
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    # Fail pipeline if CRITICAL or HIGH vulnerabilities are detected in dependencies
    - trivy fs --exit-code 1 --severity HIGH,CRITICAL --no-progress .
  allow_failure: false

sonar_quality_gate:
  stage: security_sast
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
      -Dsonar.host.url="${SONAR_HOST_URL}"
      -Dsonar.token="${SONAR_TOKEN}"
      -Dsonar.qualitygate.wait=true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "staging"'

# ------------------------------------------------------------------------------
# Stage 4: Container Build & Image Vulnerability Scan
# ------------------------------------------------------------------------------
build_and_scan_container:
  stage: security_container
  image: docker:24-cli
  services:
    - docker:24-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$APP_IMAGE" .
    # Scan the built container image with Trivy before pushing
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --exit-code 1 --severity HIGH,CRITICAL "$APP_IMAGE"
    - docker push "$APP_IMAGE"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "staging"'

# ------------------------------------------------------------------------------
# Stage 5: Deploy to Staging Environment
# ------------------------------------------------------------------------------
deploy_to_staging:
  stage: deploy_staging
  script:
    - echo "Deploying to Staging Server..."
    # Deployment steps (SSH / Helm / Portainer webhook / Tailscale SSH)
  environment:
    name: staging
    url: https://staging.example.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'

# ------------------------------------------------------------------------------
# Stage 6: DAST (Dynamic Application Security Testing via OWASP ZAP)
# ------------------------------------------------------------------------------
owasp_zap_dast_scan:
  stage: security_dast
  image: zaproxy/zap-stable:latest
  script:
    - mkdir -p /zap/wrk
    # Baseline scan against running staging instance
    - zap-baseline.py -t "https://staging.example.com" -r zap-report.html -I
    - cp /zap/wrk/zap-report.html .
  artifacts:
    when: always
    paths:
      - zap-report.html
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'

# ------------------------------------------------------------------------------
# Stage 7: Deploy to Production (With CAB Approval Gate)
# ------------------------------------------------------------------------------
deploy_to_production:
  stage: deploy_production
  script:
    - echo "Deploying to Production Cluster..."
    # Production deployment commands
  environment:
    name: production
    url: https://app.example.com
  when: manual # Requires manual operator sign-off (CAB gate)
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
