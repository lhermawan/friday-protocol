# ==============================================================================
# 🛡️ FRIDAY-PROTOCOL: GitHub Actions DevSecOps Workflow
# Compliant with BSSN Secure App Framework & OWASP Standards
# ==============================================================================

name: FRIDAY DevSecOps Pipeline

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Linting & Hygiene
  # ----------------------------------------------------------------------------
  lint:
    name: Code Quality & Style (Linter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: phpcs

      - name: Run PHP CodeSniffer (PSR12 Standard)
        run: |
          if [ -d "app" ]; then
            phpcs --standard=PSR12 app/
          else
            echo "Skipping phpcs: app directory not found"
          fi

  # ----------------------------------------------------------------------------
  # Job 2: Secret Scanning (Gitleaks)
  # ----------------------------------------------------------------------------
  secret_scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Complete Commit History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------------------------------
  # Job 3: Automated Testing & Test Coverage
  # ----------------------------------------------------------------------------
  test:
    name: Unit & Feature Test Coverage
    runs-on: ubuntu-latest
    needs: [ lint, secret_scan ]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite3
          coverage: xdebug

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Execute Automated Tests with Minimum Coverage Gate (80%)
        run: |
          cp -n .env.example .env || true
          php artisan key:generate || true
          touch database/database.sqlite || true
          php artisan test --coverage-text --min=80

  # ----------------------------------------------------------------------------
  # Job 4: Software Composition Analysis (Trivy SCA)
  # ----------------------------------------------------------------------------
  dependency_sca:
    name: Dependency Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [ test ]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1' # Fails the build if HIGH/CRITICAL CVEs found

  # ----------------------------------------------------------------------------
  # Job 5: Container Image Vulnerability Scan
  # ----------------------------------------------------------------------------
  container_scan:
    name: Docker Image Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [ dependency_sca ]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Local Container Image
        run: docker build -t app-image:${{ github.sha }} .

      - name: Run Trivy on Built Container Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'app-image:${{ github.sha }}'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  # ----------------------------------------------------------------------------
  # Job 6: DAST Scanning (OWASP ZAP on Staging)
  # ----------------------------------------------------------------------------
  dast_scan:
    name: Dynamic Web App Scan (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [ container_scan ]
    if: github.ref == 'refs/heads/staging'
    steps:
      - name: Run OWASP ZAP Baseline Scanner
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'https://staging.example.com'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
